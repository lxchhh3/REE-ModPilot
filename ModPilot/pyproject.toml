[project]
name = "modpilot"
version = "0.1.0"
description = "RE Engine character-mod steps that run inside Blender (modpilot) and their host-side tools (modpilot_host)"
readme = "README.md"
requires-python = ">=3.11"
# modpilot runs in Blender's own Python (bpy, mathutils, numpy are Blender's); the host side needs numpy
# for the bpy-free geometry tests only.
dependencies = [
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
# tests/bl run INSIDE Blender (python -m modpilot_host.bpytest, or tests/blender/test_in_blender.py)
addopts = "--ignore=tests/bl"
markers = [
    "unit: fast tests, no external services required",
    "blender: launches a headless Blender (tests/bl through tests/blender)",
    "live: talks to kevin's running Blender 5.2 on 9876 / 9877 (opt-in: -m live)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
